name: CI / CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-test:
    name: Backend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ai_agent_commercial
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check app/

      - name: Run Mypy Type Checker
        run: |
          mypy app/ --ignore-missing-imports || true

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/ai_agent_commercial
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-sales-ai-agent-2026-very-long-and-secure
        run: |
          pytest app/tests/unit/

      - name: Run Promptfoo Evaluations
        run: |
          python -m evals.run_evals

  frontend-test:
    name: Frontend Lint & Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        cwd: frontend
        run: |
          npm ci

      - name: Build Next.js app
        cwd: frontend
        run: |
          npm run build || true

      - name: Install Playwright browsers
        cwd: frontend
        run: |
          npx playwright install --with-deps || true

      - name: Run Playwright tests
        cwd: frontend
        run: |
          npx playwright test || true
